<!DOCTYPE html>

<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head('パスワード変更')}"></head>

<body>

    <header th:replace="~{fragments/header :: header('パスワード変更', false)}"></header>

    <div class="container-fluid px-4 py-4">

        <div class="card shadow-sm user-form-card">

            <div class="card-body">

                <!-- 対象ユーザー -->
                <div class="alert alert-light border mb-4">

                    対象ユーザー：
                    <strong th:text="${username}">
                        username
                    </strong>

                </div>

                <form th:action="@{/users/password}"
                      th:object="${appUserPasswordForm}"
                      method="post">

                    <!-- ID -->
                    <input type="hidden"
                           th:field="*{id}">

                    <!-- 新しいパスワード -->
                    <div class="mb-3">

                        <label class="form-label">
                            新しいパスワード
                        </label>

                        <input type="password"
                               th:field="*{password}"
                               class="form-control"
                               placeholder="新しいパスワードを入力">

                        <div class="text-danger mt-1"
                             th:if="${#fields.hasErrors('password')}"
                             th:errors="*{password}">
                        </div>

                    </div>

                    <!-- 確認用パスワード -->
                    <div class="mb-4">

                        <label class="form-label">
                            新しいパスワード（確認）
                        </label>

                        <input type="password"
                               th:field="*{confirmPassword}"
                               class="form-control"
                               placeholder="もう一度入力">

                        <div class="text-danger mt-1"
                             th:if="${#fields.hasErrors('confirmPassword')}"
                             th:errors="*{confirmPassword}">
                        </div>

                    </div>

                    <!-- ボタン -->
                    <div class="d-flex gap-2 flex-wrap">

                        <button type="submit"
                                class="btn btn-primary">
                            パスワード変更
                        </button>

                        <a th:href="@{/users}"
                           class="btn btn-outline-secondary">
                            ログインユーザー一覧に戻る
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</body>

</html>
