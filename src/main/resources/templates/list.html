<!DOCTYPE html>

<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head('会員一覧')}"></head>

<body>

    <!-- 共通ヘッダー -->
    <header th:replace="~{fragments/header :: header('会員一覧', true)}"></header>

    <div class="container-fluid px-4 py-4">

        <!-- =========================
             検索フォーム
             ========================= -->
        <form th:action="@{/search}" th:object="${condition}" method="get" class="card shadow-sm p-4 mb-4 search-card">

            <div class="row g-3">

                <!-- 名前 -->
                <div class="col-lg-3 col-md-6">

                    <label class="form-label">
                        名前
                    </label>

                    <input type="text" th:field="*{name}" class="form-control" placeholder="名前を入力">

                </div>

                <!-- 年齢 -->
                <div class="col-lg-2 col-md-3">

                    <label class="form-label">
                        年齢
                    </label>

                    <input type="number" th:field="*{age}" min="0" max="120" class="form-control" placeholder="例：30">

                </div>

                <!-- 会員種別 -->
                <div class="col-lg-2 col-md-6">

                    <label class="form-label">
                        会員種別
                    </label>

                    <select th:field="*{memberType}" class="form-select">

                        <option value="">
                            すべて
                        </option>

                        <option value="一般">
                            一般
                        </option>

                        <option value="ゴールド">
                            ゴールド
                        </option>

                    </select>

                </div>

                <!-- タグ -->
                <div class="col-lg-3 col-md-6">

                    <label class="form-label">
                        タグ
                    </label>

                    <input type="text" th:field="*{tagName}" class="form-control" placeholder="例：重要">

                </div>

                <!-- 並び順 -->
                <div class="col-lg-2 col-md-6">

                    <label class="form-label">
                        並び順
                    </label>

                    <select th:field="*{sort}" class="form-select">

                        <option value="idAsc">
                            ID昇順
                        </option>

                        <option value="idDesc">
                            ID降順
                        </option>

                        <option value="nameAsc">
                            名前昇順
                        </option>

                        <option value="ageAsc">
                            年齢昇順
                        </option>

                    </select>

                </div>

            </div>

            <div class="d-flex gap-2 mt-4 flex-wrap">

                <button type="submit" class="btn btn-primary px-4">
                    検索
                </button>

                <a th:href="@{/list}" class="btn btn-outline-secondary px-4">
                    クリア
                </a>

            </div>

        </form>


        <!-- =========================
             処理完了メッセージ
             ========================= -->

        <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${param.registered}">

            会員情報を登録しました。

            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close">
            </button>

        </div>

        <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${param.updated}">

            会員情報を更新しました。

            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close">
            </button>

        </div>

        <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${param.deleted}">

            会員情報を削除しました。

            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close">
            </button>

        </div>


        <!-- =========================
             0件メッセージ
             ========================= -->

        <div class="alert alert-info" th:if="${searched and members.isEmpty()}">

            検索結果がありません。

        </div>

        <div class="alert alert-info" th:if="${!searched and members.isEmpty()}">

            登録されている会員がありません。

        </div>


        <!-- =========================
             会員一覧
             ========================= -->
        <div class="card shadow-sm" th:if="${!members.isEmpty()}">

            <div class="table-responsive">

                <table class="table table-striped table-hover align-middle mb-0"
                    style="table-layout: fixed; width: 100%;">

                    <thead class="table-light">

                        <tr>
                            <th class="text-center" style="width: 80px;">

                            </th>

                            <th style="width: 80px;">
                                ID
                            </th>

                            <th style="width: 160px;">
                                名前
                            </th>

                            <th style="width: 100px;">
                                年齢
                            </th>

                            <th style="width: 140px;">
                                会員種別
                            </th>

                            <th>
                                タグ
                            </th>

                            <th style="width: 280px;">
                                操作
                            </th>
                        </tr>

                    </thead>

                    <tbody>

                        <tr th:each="member : ${members}" style="height: 64px;">

                            <!-- =========================
                                 プロフィール画像
                                 ========================= -->
                            <td class="text-center p-0">

                                <div class="d-flex align-items-center justify-content-center" style="
                                         height: 64px;
                                         min-height: 64px;
                                     ">

                                    <!-- 画像あり -->
                                    <img th:if="${member.profileImageName != null
                                                and !member.profileImageName.isBlank()}" th:src="@{/uploads/{filename}(
                                                filename=${member.profileImageName})}" alt="プロフィール画像"
                                        class="rounded-circle border" style="
                                             width: 48px;
                                             height: 48px;
                                             min-width: 48px;
                                             min-height: 48px;
                                             object-fit: cover;
                                             display: block;
                                         ">

                                    <!-- 画像なし -->
                                    <span th:if="${member.profileImageName == null
                                                 or member.profileImageName.isBlank()}" class="text-muted">
                                        -
                                    </span>

                                </div>

                            </td>


                            <!-- ID -->
                            <td th:text="${member.id}">
                            </td>


                            <!-- 名前 -->
                            <td th:text="${member.name}">
                            </td>


                            <!-- 年齢 -->
                            <td th:text="${member.age}">
                            </td>


                            <!-- 会員種別 -->
                            <td th:text="${member.memberType}">
                            </td>


                            <!-- タグ -->
                            <td>

                                <div class="d-flex gap-1 flex-wrap" th:if="${!member.tags.isEmpty()}">

                                    <span th:each="tag : ${member.tags}" class="badge text-bg-secondary"
                                        th:text="${tag.name}">
                                        タグ
                                    </span>

                                </div>

                                <span class="text-muted" th:if="${member.tags.isEmpty()}">
                                    -
                                </span>

                            </td>


                            <!-- 操作 -->
                            <td>

                                <div class="d-flex gap-2 flex-wrap">

                                    <!-- 通常一覧：詳細 -->
                                    <a th:if="${!searched}" th:href="@{/detail(
                                            id=${member.id},
                                            page=${memberPage.number})}" class="btn btn-outline-primary btn-sm">
                                        詳細
                                    </a>

                                    <!-- 検索結果：詳細 -->
                                    <a th:if="${searched}" th:href="@{/detail(
                                            id=${member.id},
                                            page=${memberPage.number},
                                            searched=true,
                                            name=${condition.name},
                                            age=${condition.age},
                                            memberType=${condition.memberType},
                                            tagName=${condition.tagName},
                                            sort=${condition.sort})}" class="btn btn-outline-primary btn-sm">
                                        詳細
                                    </a>


                                    <!-- 通常一覧：編集 -->
                                    <a th:if="${!searched}" th:href="@{/edit(
                                            id=${member.id},
                                            page=${memberPage.number})}" class="btn btn-outline-secondary btn-sm">
                                        編集
                                    </a>

                                    <!-- 検索結果：編集 -->
                                    <a th:if="${searched}" th:href="@{/edit(
                                            id=${member.id},
                                            page=${memberPage.number},
                                            searched=true,
                                            name=${condition.name},
                                            age=${condition.age},
                                            memberType=${condition.memberType},
                                            tagName=${condition.tagName},
                                            sort=${condition.sort})}" class="btn btn-outline-secondary btn-sm">
                                        編集
                                    </a>


                                    <!-- 通常一覧：削除 -->
                                    <a th:if="${!searched}" th:href="@{/delete(
                                            id=${member.id},
                                            page=${memberPage.number})}" class="btn btn-outline-danger btn-sm"
                                        onclick="return confirm('この会員を削除しますか？');">
                                        削除
                                    </a>

                                    <!-- 検索結果：削除 -->
                                    <a th:if="${searched}" th:href="@{/delete(
                                            id=${member.id},
                                            page=${memberPage.number},
                                            searched=true,
                                            name=${condition.name},
                                            age=${condition.age},
                                            memberType=${condition.memberType},
                                            tagName=${condition.tagName},
                                            sort=${condition.sort})}" class="btn btn-outline-danger btn-sm"
                                        onclick="return confirm('この会員を削除しますか？');">
                                        削除
                                    </a>

                                </div>

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>


        <!-- =========================
     ページング
     ========================= -->
        <nav th:if="${memberPage.totalPages > 1}" aria-label="ページ切り替え" class="mt-4">

            <ul class="pagination justify-content-center">


                <!-- =========================
             ≪ 先頭ページ：通常一覧
             ========================= -->
                <li class="page-item" th:if="${memberPage.number > 0 and !searched}">

                    <a class="page-link" th:href="@{/list(
                    page=0)}">
                        ≪
                    </a>

                </li>


                <!-- =========================
             ≪ 先頭ページ：検索結果
             ========================= -->
                <li class="page-item" th:if="${memberPage.number > 0 and searched}">

                    <a class="page-link" th:href="@{/search(
                    page=0,
                    name=${condition.name},
                    age=${condition.age},
                    memberType=${condition.memberType},
                    tagName=${condition.tagName},
                    sort=${condition.sort})}">
                        ≪
                    </a>

                </li>


                <!-- =========================
             ＜ 前ページ：通常一覧
             ========================= -->
                <li class="page-item" th:if="${memberPage.hasPrevious() and !searched}">

                    <a class="page-link" th:href="@{/list(
                    page=${memberPage.number - 1})}">
                        ＜
                    </a>

                </li>


                <!-- =========================
             ＜ 前ページ：検索結果
             ========================= -->
                <li class="page-item" th:if="${memberPage.hasPrevious() and searched}">

                    <a class="page-link" th:href="@{/search(
                    page=${memberPage.number - 1},
                    name=${condition.name},
                    age=${condition.age},
                    memberType=${condition.memberType},
                    tagName=${condition.tagName},
                    sort=${condition.sort})}">
                        ＜
                    </a>

                </li>


                <!-- =========================
             ページ番号
             ========================= -->
                <th:block th:each="pageNumber :
            ${#numbers.sequence(
                0,
                memberPage.totalPages - 1)}">


                    <!-- 通常一覧 -->
                    <li class="page-item" th:if="${!searched}" th:classappend="${pageNumber == memberPage.number}
                        ? 'active'">

                        <a class="page-link" th:href="@{/list(
                        page=${pageNumber})}" th:text="${pageNumber + 1}">
                        </a>

                    </li>


                    <!-- 検索結果 -->
                    <li class="page-item" th:if="${searched}" th:classappend="${pageNumber == memberPage.number}
                        ? 'active'">

                        <a class="page-link" th:href="@{/search(
                        page=${pageNumber},
                        name=${condition.name},
                        age=${condition.age},
                        memberType=${condition.memberType},
                        tagName=${condition.tagName},
                        sort=${condition.sort})}" th:text="${pageNumber + 1}">
                        </a>

                    </li>

                </th:block>


                <!-- =========================
             ＞ 次ページ：通常一覧
             ========================= -->
                <li class="page-item" th:if="${memberPage.hasNext() and !searched}">

                    <a class="page-link" th:href="@{/list(
                    page=${memberPage.number + 1})}">
                        ＞
                    </a>

                </li>


                <!-- =========================
             ＞ 次ページ：検索結果
             ========================= -->
                <li class="page-item" th:if="${memberPage.hasNext() and searched}">

                    <a class="page-link" th:href="@{/search(
                    page=${memberPage.number + 1},
                    name=${condition.name},
                    age=${condition.age},
                    memberType=${condition.memberType},
                    tagName=${condition.tagName},
                    sort=${condition.sort})}">
                        ＞
                    </a>

                </li>


                <!-- =========================
             ≫ 最終ページ：通常一覧
             ========================= -->
                <li class="page-item" th:if="${memberPage.number < memberPage.totalPages - 1
                   and !searched}">

                    <a class="page-link" th:href="@{/list(
                    page=${memberPage.totalPages - 1})}">
                        ≫
                    </a>

                </li>


                <!-- =========================
             ≫ 最終ページ：検索結果
             ========================= -->
                <li class="page-item" th:if="${memberPage.number < memberPage.totalPages - 1
                   and searched}">

                    <a class="page-link" th:href="@{/search(
                    page=${memberPage.totalPages - 1},
                    name=${condition.name},
                    age=${condition.age},
                    memberType=${condition.memberType},
                    tagName=${condition.tagName},
                    sort=${condition.sort})}">
                        ≫
                    </a>

                </li>

            </ul>

        </nav>

        <!-- =========================
             新規登録
             ========================= -->
        <div sec:authorize="hasAnyRole('ADMIN', 'USER')" class="mt-3">

            <a th:href="@{/}" class="btn btn-primary">
                新しく登録する
            </a>

        </div>

    </div>

</body>

</html>
