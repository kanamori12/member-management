<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>会員一覧</title>
</head>

<body>

    <h1>会員一覧</h1>
    <form th:action="@{/search}" method="get">

        名前：
        <input type="text" name="keyword">

        <button type="submit">
            検索
        </button>

    </form>

    <br>

    <table border="1">

        <tr>
            <th>ID</th>
            <th>名前</th>
            <th>年齢</th>
            <th>会員種別</th>
            <th>操作</th>
        </tr>

        <tr th:each="member : ${members}">
            <td th:text="${member.id}"></td>
            <td th:text="${member.name}"></td>
            <td th:text="${member.age}"></td>
            <td th:text="${member.memberType}"></td>
            <td>
                <a th:href="@{/delete(id=${member.id})}">削除</a>
            </td>
        </tr>

    </table>

    <br>

    <a th:href="@{/}">
        新しく登録する
    </a>

</body>

</html>
