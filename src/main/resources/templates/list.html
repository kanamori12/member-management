<!DOCTYPE html>

<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head('会員一覧')}"></head>

<body>

    <!-- 共通ヘッダー -->
    <header th:replace="~{fragments/header :: header('会員一覧', true)}"></header>

    <div class="container-fluid px-4 py-4">

        <!-- =========================
             検索フォーム
             ========================= -->

        <form th:action="@{/search}"
              th:object="${condition}"
              method="get"
              class="card shadow-sm p-4 mb-4 search-card">

            <div class="row g-3">

                <!-- 名前 -->
                <div class="col-lg-4 col-md-6">

                    <label class="form-label">
                        名前
                    </label>

                    <input type="text"
                           th:field="*{name}"
                           class="form-control"
                           placeholder="名前を入力">

                </div>

                <!-- 年齢 -->
                <div class="col-lg-2 col-md-3">

                    <label class="form-label">
                        年齢
                    </label>

                    <input type="number"
                           th:field="*{age}"
                           min="0"
                           class="form-control"
                           placeholder="例：30">

                </div>

                <!-- 会員種別 -->
                <div class="col-lg-3 col-md-6">

                    <label class="form-label">
                        会員種別
                    </label>

                    <select th:field="*{memberType}"
                            class="form-select">

                        <option value="">
                            すべて
                        </option>

                        <option value="一般">
                            一般
                        </option>

                        <option value="ゴールド">
                            ゴールド
                        </option>

                    </select>

                </div>

                <!-- 並び順 -->
                <div class="col-lg-3 col-md-6">

                    <label class="form-label">
                        並び順
                    </label>

                    <select th:field="*{sort}"
                            class="form-select">

                        <option value="idAsc">
                            ID昇順
                        </option>

                        <option value="idDesc">
                            ID降順
                        </option>

                        <option value="nameAsc">
                            名前昇順
                        </option>

                        <option value="ageAsc">
                            年齢昇順
                        </option>

                    </select>

                </div>

            </div>

            <!-- 検索ボタン -->
            <div class="d-flex gap-2 mt-4 flex-wrap">

                <button type="submit"
                        class="btn btn-primary px-4">
                    検索
                </button>

                <a th:href="@{/list}"
                   class="btn btn-outline-secondary px-4">
                    クリア
                </a>

            </div>

        </form>


        <!-- =========================
             0件メッセージ
             ========================= -->

        <!-- 検索結果0件 -->
        <div class="alert alert-info"
             th:if="${searched and members.isEmpty()}">

            検索結果がありません。

        </div>

        <!-- 通常一覧0件 -->
        <div class="alert alert-info"
             th:if="${!searched and members.isEmpty()}">

            登録されている会員がありません。

        </div>


        <!-- =========================
             会員一覧
             ========================= -->

        <div class="card shadow-sm"
             th:if="${!members.isEmpty()}">

            <div class="table-responsive">

                <table class="table table-striped table-hover align-middle mb-0">

                    <thead class="table-light">

                        <tr>
                            <th>ID</th>
                            <th>名前</th>
                            <th>年齢</th>
                            <th>会員種別</th>
                            <th>操作</th>
                        </tr>

                    </thead>

                    <tbody>

                        <tr th:each="member : ${members}">

                            <td th:text="${member.id}"></td>

                            <td th:text="${member.name}"></td>

                            <td th:text="${member.age}"></td>

                            <td th:text="${member.memberType}"></td>

                            <td>

                                <div class="d-flex gap-2 flex-wrap">

                                    <!-- 詳細 -->
                                    <a th:href="@{/detail(id=${member.id})}"
                                       class="btn btn-outline-primary btn-sm">
                                        詳細
                                    </a>

                                    <!-- 編集 -->
                                    <a th:href="@{/edit(id=${member.id})}"
                                       class="btn btn-outline-secondary btn-sm">
                                        編集
                                    </a>

                                    <!-- 削除 -->
                                    <a th:href="@{/delete(id=${member.id})}"
                                       class="btn btn-outline-danger btn-sm"
                                       onclick="return confirm('この会員を削除しますか？');">
                                        削除
                                    </a>

                                </div>

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>


        <!-- =========================
             ページング
             ========================= -->

        <nav th:if="${memberPage.totalPages > 1}"
             aria-label="ページ切り替え"
             class="mt-4">

            <ul class="pagination justify-content-center">

                <!-- ＜ 通常一覧 -->
                <li class="page-item"
                    th:if="${memberPage.hasPrevious() and !searched}">

                    <a class="page-link"
                       th:href="@{/list(
                           page=${memberPage.number - 1})}">
                        ＜
                    </a>

                </li>

                <!-- ＜ 検索結果 -->
                <li class="page-item"
                    th:if="${memberPage.hasPrevious() and searched}">

                    <a class="page-link"
                       th:href="@{/search(
                           page=${memberPage.number - 1},
                           name=${condition.name},
                           age=${condition.age},
                           memberType=${condition.memberType},
                           sort=${condition.sort})}">
                        ＜
                    </a>

                </li>


                <!-- ページ番号 -->
                <th:block th:each="pageNumber :
                    ${#numbers.sequence(
                        0,
                        memberPage.totalPages - 1)}">

                    <!-- 通常一覧 -->
                    <li class="page-item"
                        th:if="${!searched}"
                        th:classappend="${pageNumber == memberPage.number}
                            ? 'active'">

                        <a class="page-link"
                           th:href="@{/list(
                               page=${pageNumber})}"
                           th:text="${pageNumber + 1}">
                        </a>

                    </li>

                    <!-- 検索結果 -->
                    <li class="page-item"
                        th:if="${searched}"
                        th:classappend="${pageNumber == memberPage.number}
                            ? 'active'">

                        <a class="page-link"
                           th:href="@{/search(
                               page=${pageNumber},
                               name=${condition.name},
                               age=${condition.age},
                               memberType=${condition.memberType},
                               sort=${condition.sort})}"
                           th:text="${pageNumber + 1}">
                        </a>

                    </li>

                </th:block>


                <!-- ＞ 通常一覧 -->
                <li class="page-item"
                    th:if="${memberPage.hasNext() and !searched}">

                    <a class="page-link"
                       th:href="@{/list(
                           page=${memberPage.number + 1})}">
                        ＞
                    </a>

                </li>

                <!-- ＞ 検索結果 -->
                <li class="page-item"
                    th:if="${memberPage.hasNext() and searched}">

                    <a class="page-link"
                       th:href="@{/search(
                           page=${memberPage.number + 1},
                           name=${condition.name},
                           age=${condition.age},
                           memberType=${condition.memberType},
                           sort=${condition.sort})}">
                        ＞
                    </a>

                </li>

            </ul>

        </nav>


        <!-- =========================
             新規登録
             ========================= -->

        <div sec:authorize="hasAnyRole('ADMIN', 'USER')"
             class="mt-3">

            <a th:href="@{/}"
               class="btn btn-primary">
                新しく登録する
            </a>

        </div>

    </div>

</body>

</html>
