<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>会員編集</title>
</head>

<body>

    <h1>会員編集</h1>

    <form th:action="@{/update}" th:object="${member}" method="post">

        <input type="hidden" th:field="*{id}">

        名前：
        <input type="text" th:field="*{name}">
        <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color:red"></span>
        <br><br>

        年齢：
        <input type="number" th:field="*{age}">
        <span th:if="${#fields.hasErrors('age')}" th:errors="*{age}" style="color:red"></span>
        <br><br>

        会員種別：
        <input type="radio" th:field="*{memberType}" value="一般">一般

        <input type="radio" th:field="*{memberType}" value="ゴールド">ゴールド
        <span th:if="${#fields.hasErrors('memberType')}" th:errors="*{memberType}" style="color:red"></span>
        <br><br>

        <button type="submit">更新</button>

    </form>

</body>

</html>
