<!DOCTYPE html>

<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>会員編集</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

    <h1>会員編集</h1>

    <div class="form-container">

        <form th:action="@{/update}" th:object="${member}" method="post">

            <input type="hidden" th:field="*{id}">


            <div class="form-item">

                <label>名前</label>

                <input type="text" th:field="*{name}">

                <span class="error-message" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                </span>

            </div>


            <div class="form-item">

                <label>年齢</label>

                <input type="number" th:field="*{age}" min="0">

                <span class="error-message" th:if="${#fields.hasErrors('age')}" th:errors="*{age}">
                </span>

            </div>


            <div class="form-item">

                <label>会員種別</label>

                <div class="radio-group">

                    <label>
                        <input type="radio" th:field="*{memberType}" value="一般">
                        一般
                    </label>

                    <label>
                        <input type="radio" th:field="*{memberType}" value="ゴールド">
                        ゴールド
                    </label>

                </div>

                <span class="error-message" th:if="${#fields.hasErrors('memberType')}" th:errors="*{memberType}">
                </span>

            </div>


            <div class="form-buttons">

                <button type="submit" class="button button-primary">
                    更新
                </button>

                <a th:href="@{/list}" class="button button-secondary">
                    一覧に戻る
                </a>

            </div>

        </form>

    </div>

</body>

</html>
