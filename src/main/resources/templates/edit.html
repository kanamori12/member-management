<!DOCTYPE html>

<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head('会員編集')}"></head>

<body>

    <header th:replace="~{fragments/header :: header('会員編集', true)}"></header>

    <div class="container-fluid px-4 py-4">

        <div class="card shadow-sm form-card">

            <div class="card-body">

                <form th:action="@{/update}" th:object="${member}" method="post">

                    <input type="hidden" th:field="*{id}">

                    <!-- 名前 -->
                    <div class="mb-3">

                        <label class="form-label">
                            名前
                        </label>

                        <input type="text" th:field="*{name}" class="form-control">

                        <div class="text-danger mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                        </div>

                    </div>

                    <!-- 年齢 -->
                    <div class="mb-3">

                        <label class="form-label">
                            年齢
                        </label>

                        <input type="number" th:field="*{age}" min="0" class="form-control">

                        <div class="text-danger mt-1" th:if="${#fields.hasErrors('age')}" th:errors="*{age}">
                        </div>

                    </div>

                    <!-- 会員種別 -->
                    <div class="mb-4">

                        <label class="form-label">
                            会員種別
                        </label>

                        <select th:field="*{memberType}" class="form-select">

                            <option value="一般">
                                一般
                            </option>

                            <option value="ゴールド">
                                ゴールド
                            </option>

                        </select>

                        <div class="text-danger mt-1" th:if="${#fields.hasErrors('memberType')}"
                            th:errors="*{memberType}">
                        </div>

                    </div>

                    <!-- タグ -->
                    <div class="mb-4">

                        <label class="form-label">
                            タグ
                        </label>

                        <input type="text" th:field="*{tagNames}" class="form-control" placeholder="例：重要, 横浜, 要フォロー">

                        <div class="form-text">
                            複数のタグを登録する場合は、カンマ区切りで入力してください。
                        </div>

                    </div>
                    
                    <!-- ボタン -->
                    <div class="d-flex gap-2">

                        <button type="submit" class="btn btn-primary">
                            更新
                        </button>

                        <a th:href="@{/list}" class="btn btn-outline-secondary">
                            一覧に戻る
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</body>

</html>
