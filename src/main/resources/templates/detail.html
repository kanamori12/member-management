<!DOCTYPE html>

<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head('会員詳細')}"></head>

<body>

    <header th:replace="~{fragments/header :: header('会員詳細', true)}"></header>

    <div class="container-fluid px-4 py-4">

        <div class="card shadow-sm detail-card">

            <div class="card-body">

                <div class="mb-4 text-center" th:if="${member.profileImageName != null}">

                    <img th:src="@{/uploads/{filename}(
            filename=${member.profileImageName})}" alt="プロフィール画像" class="img-thumbnail"
                        style="max-width: 200px; max-height: 200px;">
                </div>
                <div class="mb-4 text-center" th:if="${member.profileImageName == null}">

                    <span class="text-muted">
                        プロフィール画像は登録されていません。
                    </span>

                </div>

                <!-- 会員情報 -->
                <div class="table-responsive">

                    <table class="table align-middle mb-4">

                        <tbody>

                            <tr>
                                <th>ID</th>
                                <td th:text="${member.id}"></td>
                            </tr>

                            <tr>
                                <th>名前</th>
                                <td th:text="${member.name}"></td>
                            </tr>

                            <tr>
                                <th>年齢</th>
                                <td th:text="${member.age}"></td>
                            </tr>

                            <tr>
                                <th>会員種別</th>
                                <td th:text="${member.memberType}"></td>
                            </tr>

                            <tr>
                                <th>タグ</th>
                                <td>

                                    <div class="d-flex gap-1 flex-wrap" th:if="${!member.tags.isEmpty()}">

                                        <span th:each="tag : ${member.tags}" class="badge text-bg-secondary"
                                            th:text="${tag.name}">
                                            タグ
                                        </span>

                                    </div>

                                    <span class="text-muted" th:if="${member.tags.isEmpty()}">
                                        -
                                    </span>

                                </td>
                            </tr>

                        </tbody>

                    </table>

                </div>

                <!-- 操作ボタン -->
                <div class="d-flex gap-2 flex-wrap">

                    <!-- =========================
         通常一覧へ戻る
         ========================= -->
                    <a th:if="${!searched}" th:href="@{/list(
            page=${page})}" class="btn btn-outline-secondary">
                        一覧に戻る
                    </a>

                    <!-- =========================
         検索結果へ戻る
         ========================= -->
                    <a th:if="${searched}" th:href="@{/search(
            page=${page},
            name=${name},
            age=${age},
            memberType=${memberType},
            tagName=${tagName},
            sort=${sort})}" class="btn btn-outline-secondary">
                        一覧に戻る
                    </a>


                    <span sec:authorize="hasAnyRole('ADMIN', 'USER')" class="d-flex gap-2">

                        <!-- =========================
             通常一覧から編集
             ========================= -->
                        <a th:if="${!searched}" th:href="@{/edit(
                id=${member.id},
                page=${page})}" class="btn btn-outline-primary">
                            編集
                        </a>

                        <!-- =========================
             検索結果から編集
             ========================= -->
                        <a th:if="${searched}" th:href="@{/edit(
                id=${member.id},
                page=${page},
                searched=true,
                name=${name},
                age=${age},
                memberType=${memberType},
                tagName=${tagName},
                sort=${sort})}" class="btn btn-outline-primary">
                            編集
                        </a>


                        <!-- =========================
             通常一覧から削除
             ========================= -->
                        <a th:if="${!searched}" th:href="@{/delete(
                id=${member.id},
                page=${page})}" class="btn btn-outline-danger" onclick="return confirm('この会員を削除しますか？');">
                            削除
                        </a>

                        <!-- =========================
             検索結果から削除
             ========================= -->
                        <a th:if="${searched}" th:href="@{/delete(
                id=${member.id},
                page=${page},
                searched=true,
                name=${name},
                age=${age},
                memberType=${memberType},
                tagName=${tagName},
                sort=${sort})}" class="btn btn-outline-danger" onclick="return confirm('この会員を削除しますか？');">
                            削除
                        </a>

                    </span>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
