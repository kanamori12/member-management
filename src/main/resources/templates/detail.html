<!DOCTYPE html>

<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head('会員詳細')}"></head>

<body>

    <header th:replace="~{fragments/header :: header('会員詳細', true)}"></header>

    <div class="container-fluid px-4 py-4">

        <div class="card shadow-sm detail-card">

            <div class="card-body">

                <!-- 会員情報 -->
                <div class="table-responsive">

                    <table class="table align-middle mb-4">

                        <tbody>

                            <tr>
                                <th>ID</th>
                                <td th:text="${member.id}"></td>
                            </tr>

                            <tr>
                                <th>名前</th>
                                <td th:text="${member.name}"></td>
                            </tr>

                            <tr>
                                <th>年齢</th>
                                <td th:text="${member.age}"></td>
                            </tr>

                            <tr>
                                <th>会員種別</th>
                                <td th:text="${member.memberType}"></td>
                            </tr>

                        </tbody>

                    </table>

                </div>

                <!-- 操作ボタン -->
                <div class="d-flex gap-2 flex-wrap">

                    <a th:href="@{/list}"
                       class="btn btn-outline-secondary">
                        一覧に戻る
                    </a>

                    <span sec:authorize="hasAnyRole('ADMIN', 'USER')"
                          class="d-flex gap-2">

                        <a th:href="@{/edit(id=${member.id})}"
                           class="btn btn-outline-primary">
                            編集
                        </a>

                        <a th:href="@{/delete(id=${member.id})}"
                           class="btn btn-outline-danger"
                           onclick="return confirm('この会員を削除しますか？');">
                            削除
                        </a>

                    </span>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
