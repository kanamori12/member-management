<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>ログインユーザー登録</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <header th:replace="~{fragments/header :: header('ログインユーザー登録', false)}"></header>

    <div class="form-container">

        <form th:action="@{/users/register}" th:object="${appUserForm}" method="post">

            <div class="form-item">

                <label>ユーザー名</label>

                <input type="text" th:field="*{username}">

                <span class="error-message" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">
                </span>

            </div>

            <div class="form-item">

                <label>パスワード</label>

                <input type="password" th:field="*{password}">

                <span class="error-message" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">
                </span>

            </div>

            <div class="form-item">

                <label>権限</label>

                <select th:field="*{role}">
                    <option value="">選択してください</option>
                    <option value="USER">USER</option>
                    <option value="ADMIN">ADMIN</option>
                </select>

                <span class="error-message" th:if="${#fields.hasErrors('role')}" th:errors="*{role}">
                </span>

            </div>

            <div class="form-buttons">

                <button type="submit" class="button button-primary">
                    登録
                </button>

                <a th:href="@{/users}" class="button button-secondary">
                    一覧に戻る
                </a>

            </div>

        </form>

    </div>

</body>

</html>
