<!DOCTYPE html>

<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head('ログインユーザー一覧')}"></head>

<body>

    <header th:replace="~{fragments/header :: header('ログインユーザー一覧', false)}"></header>

    <div class="container-fluid px-4 py-4">

        <!-- 成功メッセージ -->

        <div class="alert alert-success"
             th:if="${param.registered}">
            ログインユーザーを登録しました。
        </div>

        <div class="alert alert-success"
             th:if="${param.updated}">
            ログインユーザーを更新しました。
        </div>

        <div class="alert alert-success"
             th:if="${param.deleted}">
            ログインユーザーを削除しました。
        </div>

        <div class="alert alert-success"
             th:if="${param.passwordChanged}">
            パスワードを変更しました。
        </div>


        <!-- ユーザー一覧 -->

        <div class="card shadow-sm">

            <div class="table-responsive">

                <table class="table table-striped table-hover align-middle mb-0">

                    <thead class="table-light">

                        <tr>
                            <th>ID</th>
                            <th>ユーザー名</th>
                            <th>権限</th>
                            <th>操作</th>
                        </tr>

                    </thead>

                    <tbody>

                        <tr th:each="user : ${users}">

                            <td th:text="${user.id}"></td>

                            <td th:text="${user.username}"></td>

                            <td th:text="${user.role}"></td>

                            <td>

                                <div class="d-flex gap-2 flex-wrap">

                                    <a th:href="@{/users/edit(id=${user.id})}"
                                       class="btn btn-outline-secondary btn-sm">
                                        編集
                                    </a>

                                    <a th:href="@{/users/password(id=${user.id})}"
                                       class="btn btn-outline-primary btn-sm">
                                        パスワード変更
                                    </a>

                                    <a th:href="@{/users/delete(id=${user.id})}"
                                       class="btn btn-outline-danger btn-sm"
                                       onclick="return confirm('このログインユーザーを削除しますか？');">
                                        削除
                                    </a>

                                </div>

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>


        <!-- 操作ボタン -->

        <div class="d-flex gap-2 mt-4">

            <a th:href="@{/users/register}"
               class="btn btn-primary">
                新しいユーザーを登録
            </a>

            <a th:href="@{/list}"
               class="btn btn-outline-secondary">
                会員一覧に戻る
            </a>

        </div>

    </div>

</body>

</html>
