<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>ログインユーザー編集</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<header th:replace="~{fragments/header :: header('ログインユーザー編集', false)}"></header>

<div class="form-container">

    <form th:action="@{/users/update}"
          th:object="${appUserEditForm}"
          method="post">

        <input type="hidden" th:field="*{id}">

        <div class="form-item">

            <label>ユーザー名</label>

            <input type="text"
                   th:field="*{username}">

            <span class="error-message"
                  th:if="${#fields.hasErrors('username')}"
                  th:errors="*{username}">
            </span>

        </div>

        <div class="form-item">

            <label>権限</label>

            <select th:field="*{role}">
                <option value="USER">USER</option>
                <option value="ADMIN">ADMIN</option>
            </select>

            <span class="error-message"
                  th:if="${#fields.hasErrors('role')}"
                  th:errors="*{role}">
            </span>

        </div>

        <div class="form-buttons">

            <button type="submit"
                    class="button button-primary">
                更新
            </button>

            <a th:href="@{/users}"
               class="button button-secondary">
                一覧に戻る
            </a>

        </div>

    </form>

</div>

</body>
</html>
