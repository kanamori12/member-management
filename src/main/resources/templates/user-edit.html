<!DOCTYPE html>

<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head('ログインユーザー編集')}"></head>

<body>

    <header th:replace="~{fragments/header :: header('ログインユーザー編集', false)}"></header>

    <div class="container-fluid px-4 py-4">

        <div class="card shadow-sm user-form-card">

            <div class="card-body">

                <form th:action="@{/users/update}"
                      th:object="${appUserEditForm}"
                      method="post">

                    <!-- ID -->
                    <input type="hidden"
                           th:field="*{id}">

                    <!-- ユーザー名 -->
                    <div class="mb-3">

                        <label class="form-label">
                            ユーザー名
                        </label>

                        <input type="text"
                               th:field="*{username}"
                               class="form-control">

                        <div class="text-danger mt-1"
                             th:if="${#fields.hasErrors('username')}"
                             th:errors="*{username}">
                        </div>

                    </div>

                    <!-- 権限 -->
                    <div class="mb-4">

                        <label class="form-label">
                            権限
                        </label>

                        <select th:field="*{role}"
                                class="form-select">

                            <option value="USER">
                                USER
                            </option>

                            <option value="ADMIN">
                                ADMIN
                            </option>

                        </select>

                        <div class="text-danger mt-1"
                             th:if="${#fields.hasErrors('role')}"
                             th:errors="*{role}">
                        </div>

                    </div>

                    <!-- ボタン -->
                    <div class="d-flex gap-2">

                        <button type="submit"
                                class="btn btn-primary">
                            更新
                        </button>

                        <a th:href="@{/users}"
                           class="btn btn-outline-secondary">
                            ログインユーザー一覧に戻る
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</body>

</html>
