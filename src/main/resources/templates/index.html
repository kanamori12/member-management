<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>会員管理システム</title>
</head>
<body>

<h1>会員管理システム</h1>

<form th:action="@{/register}" th:object="${member}" method="post">

    <p>
        名前<br>
        <input type="text" th:field="*{name}">
    </p>

    <p>
        年齢<br>
        <input type="number" th:field="*{age}">
    </p>

    <p>
        会員種別<br>

        <input type="radio"
               th:field="*{memberType}"
               value="一般">一般

        <input type="radio"
               th:field="*{memberType}"
               value="ゴールド">ゴールド
    </p>

    <button type="submit">
        登録
    </button>

</form>
</body>
</html>
