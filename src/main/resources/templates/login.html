<!DOCTYPE html>

<html lang="ja"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('ログイン')}"></head>

<body>

    <div class="container-fluid px-4 py-5">

        <div class="card shadow-sm auth-card">

            <div class="card-body">

                <h1 class="h4 mb-4">
                    ログイン
                </h1>

                <!-- ログイン失敗 -->
                <div class="alert alert-danger"
                     th:if="${param.error}">
                    ユーザー名またはパスワードが正しくありません。
                </div>

                <!-- ログアウト成功 -->
                <div class="alert alert-success"
                     th:if="${param.logout}">
                    ログアウトしました。
                </div>

                <form th:action="@{/login}"
                      method="post">

                    <!-- ユーザー名 -->
                    <div class="mb-3">

                        <label class="form-label">
                            ユーザー名
                        </label>

                        <input type="text"
                               name="username"
                               class="form-control"
                               autocomplete="username"
                               autofocus>

                    </div>

                    <!-- パスワード -->
                    <div class="mb-4">

                        <label class="form-label">
                            パスワード
                        </label>

                        <input type="password"
                               name="password"
                               class="form-control"
                               autocomplete="current-password">

                    </div>

                    <!-- ログインボタン -->
                    <button type="submit"
                            class="btn btn-primary px-4">
                        ログイン
                    </button>

                </form>

            </div>

        </div>

    </div>

</body>

</html>
